<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h2 class="mb-0">To Do Application</h2>
        </div>
        <div class="card-body" style="position: relative; overflow: hidden;">
          <form (ngSubmit)="addTask()" class="d-flex mb-3 gap-2">
            <input
              type="text"
              [(ngModel)]="task"
              name="task"
              placeholder="Enter a new task"
              required
              class="form-control"
            />
            <button type="submit" class="btn btn-success" [disabled]="!task.trim()">Add Task</button>
          </form>
          <ul class="list-group">
            <li
              *ngFor="let t of tasks; let i = index"
              class="list-group-item d-flex justify-content-between align-items-center"
              [@taskAnim]
            >
              <span>{{ t }}</span>
              <button (click)="removeTask(i)" class="btn btn-danger btn-sm">Remove</button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
