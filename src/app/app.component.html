<div class="container">
  <h2>Book Form</h2>
  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <p>
        Book Name : <input type="text" class="form-control" formControlName="bookName">
      </p>
      <div>
        <label for="bookAuthor">Book Author: </label>
        <input id="bookAuthor" type="text" class="form-control" formControlName="bookAuthor" />
      </div>
      @if (bookForm.invalid) {
      <div style="color: red">
        Book Name is required
      </div>
      }
      <p>
        Book Price : <input type="text" class="form-control" formControlName="bookPrice">
      </p>
      <div formArrayName="bookDetails">
        <div *ngFor="let bookDetail of bookDetails.controls; index as idx">
          Chapter Name: <input type="text" class="form-control" [formControlName]="idx">
          <button type="button" (click)="addChapterField()" class="btn btn-success">Add Chapter</button>
          <button type="button" (click)="deleteChapterField(idx)" class="btn btn-danger">Delete Chapter</button>
        </div>
      </div>

      
      <div>
        <button type="submit" [disabled]="bookForm.invalid" class="btn btn-success">Click</button>
      </div>
    </div>
  </form>
